name: CPU correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        transformers: ["4.57.6", "5.20.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install 'transformers==${{ matrix.transformers }}'
      - name: Check deterministic standalone build
        run: python scripts/build_standalone.py --check
      - name: Test builder and launcher integrity
        run: python -m unittest discover -s tests -v
      - name: Test source and cache API compatibility without model downloads
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python qwen_kv_gpu_bench.py --self-test
